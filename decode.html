<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBERCRAFT - Decode</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav>
            <div class="logo">CYBER<span>CRAFT</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="encode.html">Encode</a></li>
                <li><a href="decode.html" class="active">Decode</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>🔓 <span class="highlight">Decode</span> Your Data</h1>
            <p>Select a decoding method, enter your encoded text, and click decode.</p>

            <div style="margin: 1.5rem 0;">
                <label for="decodeMethod" style="font-weight: 600; color: #00d4ff;">Decoding Method:</label>
                <select id="decodeMethod" style="
                    width: 100%;
                    padding: 0.8rem;
                    background: rgba(0,0,0,0.4);
                    border: 1px solid rgba(0,212,255,0.2);
                    border-radius: 10px;
                    color: #fff;
                    font-size: 1rem;
                    margin-top: 0.5rem;
                    cursor: pointer;
                ">
                    <option value="base64">Base64</option>
                    <option value="rot13">ROT13</option>
                    <option value="url">URL Decode</option>
                    <option value="hex">Hex to Text</option>
                    <option value="binary">Binary to Text</option>
                    <option value="caesar">Caesar Cipher</option>
                </select>
            </div>

            <div id="caesarShiftDecode" style="display: none; margin-bottom: 1rem;">
                <label for="shiftAmountDecode" style="font-weight: 600; color: #00d4ff;">Shift Amount:</label>
                <input type="number" id="shiftAmountDecode" value="3" min="1" max="25" style="
                    width: 100px;
                    padding: 0.5rem;
                    background: rgba(0,0,0,0.4);
                    border: 1px solid rgba(0,212,255,0.2);
                    border-radius: 10px;
                    color: #fff;
                    font-size: 1rem;
                    margin-top: 0.5rem;
                " />
            </div>

            <textarea id="inputTextDecode" placeholder="Enter encoded text to decode..."></textarea>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="decodeText()">🔓 Decode</button>
                <button class="btn btn-outline" onclick="clearFieldsDecode()">🗑️ Clear</button>
            </div>

            <div>
                <h3 style="color: #00d4ff; margin-bottom: 0.5rem;">Result:</h3>
                <div class="result-box" id="resultDecode">Your decoded text will appear here...</div>
                <button class="btn btn-success" onclick="copyResultDecode()" style="margin-top: 0.5rem;">📋 Copy</button>
            </div>
        </section>
    </main>

    <footer>
        <p>
            Made with <span class="heart">❤</span> by <strong>TWARVIS</strong>

                WhatsApp
            </a>
        </p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('decodeMethod').addEventListener('change', function() {
            document.getElementById('caesarShiftDecode').style.display = this.value === 'caesar' ? 'block' : 'none';
        });

        function decodeText() {
            const method = document.getElementById('decodeMethod').value;
            const text = document.getElementById('inputTextDecode').value;
            const resultDiv = document.getElementById('resultDecode');
            
            if (!text) {
                resultDiv.textContent = '⚠️ Please enter some text to decode.';
                resultDiv.style.color = '#ff6b6b';
                return;
            }

            let result = '';
            switch(method) {
                case 'base64':
                    result = decodeBase64(text);
                    break;
                case 'rot13':
                    result = rot13(text);
                    break;
                case 'url':
                    result = decodeURL(text);
                    break;
                case 'hex':
                    result = hexToText(text);
                    break;
                case 'binary':
                    result = binaryToText(text);
                    break;
                case 'caesar':
                    const shift = parseInt(document.getElementById('shiftAmountDecode').value) || 3;
                    result = caesarCipher(text, -shift);
                    break;
                default:
                    result = '❌ Unknown method';
            }
            
            resultDiv.textContent = result;
            resultDiv.style.color = result.startsWith('❌') ? '#ff6b6b' : '#00d4ff';
        }

        function copyResultDecode() {
            const text = document.getElementById('resultDecode').textContent;
            if (text && !text.includes('Your decoded text')) {
                copyToClipboard(text);
            } else {
                showToast('Nothing to copy!');
            }
        }

        function clearFieldsDecode() {
            document.getElementById('inputTextDecode').value = '';
            document.getElementById('resultDecode').textContent = 'Your decoded text will appear here...';
            document.getElementById('resultDecode').style.color = '#00d4ff';
        }
    </script>
</body>
</html>
