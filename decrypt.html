    <main>
        <section class="card">
            <h1>🔓 <span class="highlight">Decrypt</span> Your Data</h1>
            <p>Decrypt data using 20+ methods.</p>

            <div style="margin: 1.5rem 0;">
                <label for="decryptMethod" style="font-weight: 600; color: #00d4ff;">Decryption Method:</label>
                <select id="decryptMethod" style="width:100%; padding:0.8rem; background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:#fff; font-size:1rem; margin-top:0.5rem; cursor:pointer;">
                    <optgroup label="🔓 Symmetric Decryption">
                        <option value="aes-cbc">AES-CBC</option>
                        <option value="aes-gcm">AES-GCM</option>
                        <option value="3des">Triple DES (3DES)</option>
                    </optgroup>
                    <optgroup label="📜 Classic Ciphers">
                        <option value="rot13">ROT13</option>
                        <option value="caesar">Caesar Cipher</option>
                        <option value="vigenere">Vigenère Cipher</option>
                        <option value="xor">XOR Cipher</option>
                        <option value="railfence">Rail Fence Cipher</option>
                    </optgroup>
                    <optgroup label="🔢 Decoding">
                        <option value="base64">Base64</option>
                        <option value="url">URL Decode</option>
                        <option value="hex">Hex Decode</option>
                        <option value="binary">Binary Decode</option>
                        <option value="html">HTML Entities</option>
                    </optgroup>
                    <optgroup label="🔑 Token">
                        <option value="jwt">JWT Decode</option>
                    </optgroup>
                </select>
            </div>

            <div id="passwordFieldDecrypt" style="display: none; margin-bottom: 1rem;">
                <label for="decryptPassword" style="font-weight: 600; color: #00d4ff;">Password/Key:</label>
                <input type="password" id="decryptPassword" placeholder="Enter password/key..." style="width:100%; padding:0.8rem; background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:#fff; font-size:1rem; margin-top:0.5rem;" />
            </div>

            <div id="keyFieldDecrypt" style="display: none; margin-bottom: 1rem;">
                <label for="decryptKey" style="font-weight: 600; color: #00d4ff;">Key (for Vigenère/XOR):</label>
                <input type="text" id="decryptKey" placeholder="Enter key..." style="width:100%; padding:0.8rem; background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:#fff; font-size:1rem; margin-top:0.5rem;" />
            </div>

            <div id="shiftFieldDecrypt" style="display: none; margin-bottom: 1rem;">
                <label for="decryptShift" style="font-weight: 600; color: #00d4ff;">Shift Amount:</label>
                <input type="number" id="decryptShift" value="3" min="1" max="25" style="width:100px; padding:0.5rem; background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:#fff; font-size:1rem; margin-top:0.5rem;" />
            </div>

            <div id="railsFieldDecrypt" style="display: none; margin-bottom: 1rem;">
                <label for="decryptRails" style="font-weight: 600; color: #00d4ff;">Number of Rails:</label>
                <input type="number" id="decryptRails" value="3" min="2" max="10" style="width:100px; padding:0.5rem; background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:#fff; font-size:1rem; margin-top:0.5rem;" />
            </div>

            <textarea id="inputDecrypt" placeholder="Enter encrypted text to decrypt..."></textarea>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="decryptText()">🔓 Decrypt</button>
                <button class="btn btn-outline" onclick="clearDecryptFields()">🗑️ Clear</button>
            </div>

            <div>
                <h3 style="color: #00d4ff; margin-bottom: 0.5rem;">Result:</h3>
                <div class="result-box" id="resultDecrypt">Your decrypted text will appear here...</div>
                <button class="btn btn-success" onclick="copyResultDecrypt()" style="margin-top: 0.5rem;">📋 Copy</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="crypto.js"></script>
    <script>
        document.getElementById('decryptMethod').addEventListener('change', function() {
            const method = this.value;
            const needsPassword = ['aes-cbc', 'aes-gcm', '3des'].includes(method);
            const needsKey = ['vigenere', 'xor'].includes(method);
            const needsShift = ['caesar'].includes(method);
            const needsRails = ['railfence'].includes(method);
            
            document.getElementById('passwordFieldDecrypt').style.display = needsPassword ? 'block' : 'none';
            document.getElementById('keyFieldDecrypt').style.display = needsKey ? 'block' : 'none';
            document.getElementById('shiftFieldDecrypt').style.display = needsShift ? 'block' : 'none';
            document.getElementById('railsFieldDecrypt').style.display = needsRails ? 'block' : 'none';
        });

        async function decryptText() {
            const method = document.getElementById('decryptMethod').value;
            const text = document.getElementById('inputDecrypt').value;
            const resultDiv = document.getElementById('resultDecrypt');
            
            if (!text) {
                resultDiv.textContent = '⚠️ Please enter some text to decrypt.';
                resultDiv.style.color = '#ff6b6b';
                return;
            }

            let result = '';
            try {
                switch(method) {
                    case 'aes-cbc': {
                        const password = document.getElementById('decryptPassword').value || 'default123';
                        result = await aesCbcDecrypt(text, password);
                        break;
                    }
                    case 'aes-gcm': {
                        const password = document.getElementById('decryptPassword').value || 'default123';
                        result = await aesGcmDecrypt(text, password);
                        break;
                    }
                    case '3des': {
                        const password = document.getElementById('decryptPassword').value || 'default123';
                        result = await tripleDesDecrypt(text, password);
                        break;
                    }
                    case 'rot13':
                        result = rot13(text);
                        break;
                    case 'caesar': {
                        const shift = parseInt(document.getElementById('decryptShift').value) || 3;
                        result = caesarCipher(text, -shift);
                        break;
                    }
                    case 'vigenere': {
                        const key = document.getElementById('decryptKey').value || 'KEY';
                        result = vigenereDecipher(text, key);
                        break;
                    }
                    case 'xor': {
                        const key = document.getElementById('decryptKey').value || 'X';
                        result = xorDecipher(text, key);
                        break;
                    }
                    case 'railfence': {
                        const rails = parseInt(document.getElementById('decryptRails').value) || 3;
                        result = railFenceDecipher(text, rails);
                        break;
                    }
                    case 'base64':
                        result = base64Decode(text);
                        break;
                    case 'url':
                        result = urlDecode(text);
                        break;
                    case 'hex':
                        result = hexDecode(text);
                        break;
                    case 'binary':
                        result = binaryDecode(text);
                        break;
                    case 'html':
                        result = htmlDecode(text);
                        break;
                    case 'jwt':
                        result = jwtDecode(text);
                        break;
                    default:
                        result = '❌ Unknown method';
                }
            } catch (e) {
                result = '❌ Error: ' + e.message;
            }
            
            resultDiv.textContent = result;
            resultDiv.style.color = result.startsWith('❌') || result.startsWith('⚠️') ? '#ff6b6b' : '#00d4ff';
        }

        function copyResultDecrypt() {
            const text = document.getElementById('resultDecrypt').textContent;
            if (text && !text.includes('Your decrypted text')) {
                copyToClipboard(text);
            } else {
                showToast('Nothing to copy!');
            }
        }

        function clearDecryptFields() {
            document.getElementById('inputDecrypt').value = '';
            document.getElementById('resultDecrypt').textContent = 'Your decrypted text will appear here...';
            document.getElementById('resultDecrypt').style.color = '#00d4ff';
        }
    </script>
</body>
</html>
